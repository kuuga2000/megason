services:
  nginx:
    build:
      context: ./nginx
      args:
        NGINX_VERSION: ${NGINX_VERSION}
    ports:
      - "${NGINX_HOST_PORT}:80"
    depends_on:
      - phpfpm
    volumes:
      - ./magento237:/var/www/html:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - megason

  phpfpm:
    build:
      context: ./magento237
      args:
        PHP_VERSION: ${PHP_VERSION}
        COMPOSER_VERSION: ${COMPOSER_VERSION}
    depends_on:
      mariadb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./magento237:/var/www/html:cached
    environment:
      APP_DIR: /var/www/html
      MAGENTO_VERSION: ${MAGENTO_VERSION}
      MAGENTO_BASE_URL: http://localhost:${NGINX_HOST_PORT}/
      MAGENTO_PUBLIC_KEY: ${MAGENTO_PUBLIC_KEY:-}
      MAGENTO_PRIVATE_KEY: ${MAGENTO_PRIVATE_KEY:-}
      MAGENTO_DB_HOST: ${MARIADB_HOST}
      MAGENTO_DB_NAME: ${MARIADB_DATABASE}
      MAGENTO_DB_USER: ${MARIADB_USER}
      MAGENTO_DB_PASSWORD: ${MARIADB_PASSWORD}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MAGENTO_ADMIN_USER: ${MAGENTO_ADMIN_USER}
      MAGENTO_ADMIN_PASSWORD: ${MAGENTO_ADMIN_PASSWORD}
      MAGENTO_ADMIN_EMAIL: ${MAGENTO_ADMIN_EMAIL}
      TZ: ${TZ}
    networks:
      - megason

  mariadb:
    build:
      context: ./mariadb
      args:
        MARIADB_VERSION: ${MARIADB_VERSION}
    ports:
      - "${MARIADB_HOST_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - megason

  elasticsearch:
    build:
      context: ./elasticsearch
      args:
        ELASTICSEARCH_VERSION: ${ELASTICSEARCH_VERSION}
    ports:
      - "${ELASTICSEARCH_HOST_PORT}:9200"
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - megason

  redis:
    build:
      context: ./redis
      args:
        REDIS_VERSION: ${REDIS_VERSION}
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - megason

  rabbitmq:
    build:
      context: ./rabbitmq
      args:
        RABBITMQ_VERSION: ${RABBITMQ_VERSION}
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - megason

  varnish:
    build:
      context: ./varnish
      args:
        VARNISH_VERSION: ${VARNISH_VERSION}
    ports:
      - "${VARNISH_HOST_PORT}:80"
    depends_on:
      - nginx
    networks:
      - megason

networks:
  megason:
    driver: bridge

volumes:
  mariadb_data:
  elasticsearch_data:
  redis_data:
  rabbitmq_data:
